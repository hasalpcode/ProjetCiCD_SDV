apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  namespace: cicd-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-api
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      containers:
        - name: todo-api
          image: hasalpcode/todo-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/todo_db?serverTimezone=UTC&useSSL=false
            - name: SPRING_DATASOURCE_USERNAME
              value: todoapp
            - name: SPRING_DATASOURCE_PASSWORD
              value: todoapp
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            - name: SERVER_PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: todo-api
  namespace: cicd-project
spec:
  type: NodePort
  selector:
    app: todo-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
