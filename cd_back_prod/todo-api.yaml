apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-api
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mysql-db 3306; do echo waiting for mysql-db; sleep 2; done']
      containers:
        - name: todo-api
          image: hasalpcode/projet_ci_cd_sdv:49
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-db:3306/todo_db
            - name: SPRING_DATASOURCE_USERNAME
              value: todoapp
            - name: SPRING_DATASOURCE_PASSWORD
              value: todoapp
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx224m -XX:MaxMetaspaceSize=96m"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: todo-api
spec:
  type: NodePort
  selector:
    app: todo-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
