apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-front
  template:
    metadata:
      labels:
        app: todo-front
    spec:
      containers:
        - name: todo-front
          image: hasalpcode/projet_ci_cd_sdv-front:f8aab6c6eebf13bc14dd63d5f1b9963ef1a05ce5
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: todo-front
spec:
  type: NodePort
  selector:
    app: todo-front
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
