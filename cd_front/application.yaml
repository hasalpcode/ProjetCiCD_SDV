apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-front
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/hasalpcode/ProjetCiCD_SDV.git
    targetRevision: main
    path: cd_front
    directory:
      exclude: "application.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
