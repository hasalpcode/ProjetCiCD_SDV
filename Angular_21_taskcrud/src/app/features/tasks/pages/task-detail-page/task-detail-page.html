@if (task(); as t) {
  <div class="max-w-lg mx-auto bg-white rounded-lg shadow p-6">
    <h2 class="text-2xl font-bold text-slate-800">{{ t.title }}</h2>
    <p class="mt-2 text-slate-600">{{ t.description }}</p>
    <p class="mt-2">Priorité : {{ t.priority }}</p>
    <p class="mt-2">Statut : {{ t.done ? '✓ Terminée' : 'En cours' }}</p>
    <a routerLink="/tasks" class="inline-block mt-4 text-blue-600 hover:underline">← Retour</a>
  </div>
} @else {
  <p>Tâche introuvable.</p>
}
