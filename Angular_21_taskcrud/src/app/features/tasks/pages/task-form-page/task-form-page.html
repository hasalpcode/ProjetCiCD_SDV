<div class="max-w-lg mx-auto bg-white rounded-lg shadow p-6">
  <h2 class="text-2xl font-bold text-slate-800 mb-4">Nouvelle tâche</h2>

  <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

    <!-- Titre -->
    <div>
      <label class="block text-sm font-medium text-slate-700">Titre</label>
      <input formControlName="title"
             class="mt-1 w-full border border-slate-300 rounded px-3 py-2" />

      @if (taskForm.get('title')?.touched && taskForm.get('title')?.invalid) {
        <p class="text-red-600 text-sm mt-1">
          Le titre est obligatoire (3 caractères minimum).
        </p>
      }
    </div>

    <!-- Description -->
    <div>
      <label class="block text-sm font-medium text-slate-700">Description</label>
      <textarea formControlName="description"
                class="mt-1 w-full border border-slate-300 rounded px-3 py-2"></textarea>
    </div>

    <!-- Priorité -->
    <div>
      <label class="block text-sm font-medium text-slate-700">Priorité</label>
      <select formControlName="priority"
              class="mt-1 w-full border border-slate-300 rounded px-3 py-2">
        <option value="basse">Basse</option>
        <option value="moyenne">Moyenne</option>
        <option value="haute">Haute</option>
      </select>
    </div>

    <!-- Tags -->
    <div>
      <label class="block text-sm font-medium text-slate-700">Tags (séparés par des virgules)</label>
      <input formControlName="tags" placeholder="angular, java, urgent"
             class="mt-1 w-full border border-slate-300 rounded px-3 py-2" />
    </div>

    <button type="submit"
     [disabled]="taskForm.invalid"
            class="bg-slate-800 text-white rounded py-2 hover:bg-slate-700
               disabled:opacity-50 disabled:cursor-not-allowed">
      Créer la tâche
    </button>

  </form>
</div>
