<article class="flex h-full w-full flex-col overflow-hidden rounded-3xl border border-slate-200 bg-white/90 shadow-[0_20px_45px_rgba(15,23,42,0.08)] backdrop-blur-sm transition duration-300 hover:-translate-y-1 hover:shadow-[0_26px_52px_rgba(37,99,235,0.12)]">
  <div class="p-2.5">
    <div
      class="flex h-60 w-full items-center justify-center rounded-2xl bg-gradient-to-br from-sky-50 to-teal-50"
      [attr.aria-label]="mytask().title"
      role="img"
    >
      <svg
        class="h-24 w-24 text-sky-500"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <rect x="5" y="3" width="14" height="18" rx="2" />
        <path d="M9 3v2a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1V3" />
        <path d="m9 12 2 2 4-4" stroke-linecap="round" stroke-linejoin="round" />
        <line x1="8" y1="17" x2="16" y2="17" stroke-linecap="round" />
      </svg>
    </div>
  </div>

  <div class="flex-1 px-4 pb-4 pt-1">
    <div class="mb-3 flex items-start justify-between gap-3">
      <h6 class="text-xl font-black text-slate-800">{{ mytask().title }}</h6>
      <app-badge [label]="mytask().priority" color="red"></app-badge>
    </div>

    <p class="text-sm leading-6 text-slate-600">{{ mytask().description }}</p>

    @if (mytask().done) {
      <p class="mt-3 inline-flex rounded-full bg-emerald-100 px-2.5 py-1 text-sm font-semibold text-emerald-700">
        Status : ✓ Terminée
      </p>
    } @else {
      <p class="mt-3 inline-flex rounded-full bg-sky-100 px-2.5 py-1 text-sm font-semibold text-sky-700">
        Status : En cours
      </p>
    }

    <div class="mt-4 flex flex-wrap gap-2">
      @for (tag of mytask().tags; track tag) {
        <span class="rounded-full bg-sky-100 px-2.5 py-1 text-xs font-semibold text-sky-700">
          {{ tag }}
        </span>
      }
    </div>
  </div>

  <div class="flex items-center gap-2 border-t border-slate-100 px-4 py-3">
    <button
      class="flex-1 rounded-xl bg-gradient-to-r from-sky-600 to-teal-500 px-4 py-2.5 text-sm font-semibold text-white shadow-md shadow-sky-500/20 transition hover:brightness-110"
      (click)="onToggleClick()"
    >
      {{ mytask().done ? 'Rouvrir' : 'Terminer' }}
    </button>
    <a
      [routerLink]="['/tasks', mytask().id]"
      class="rounded-xl border border-sky-200 bg-sky-50 px-3 py-2.5 text-sm font-semibold text-sky-700 transition hover:bg-sky-100"
    >
      Détail
    </a>
  </div>
</article>
