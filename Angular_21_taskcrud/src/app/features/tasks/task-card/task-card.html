<div class="rounded-lg border overflow-hidden bg-white border-slate-200 w-full max-w-[26rem] shadow-lg">

  <!-- Image : alt lié à la tâche (property binding) pour l'accessibilité -->
  <div class="p-2 rounded relative">
    <img
      class="w-full h-full rounded"
      src="https://images.unsplash.com/photo-1499696010180-025ef6e1a8f9?w=800&q=80"
      [alt]="mytask().title" />
  </div>

  <div class="px-3.5 py-2.5">

    <!-- Titre + priorité -->
    <div class="mb-2 flex items-center justify-between">
      <h6 class="font-bold text-lg lg:text-xl text-slate-800">{{ mytask().title }}</h6>
      <app-badge [label]="mytask().priority" color="red"></app-badge>
    </div>

    <!-- Description -->
    <p class="text-base text-slate-600">{{ mytask().description }}</p>

    <!-- Statut conditionnel -->
    @if (mytask().done) {
      <p class="mt-2 text-base text-green-600">Status : ✓ Terminée</p>
    } @else {
      <p class="mt-2 text-base text-gray-600">Status : En cours</p>
    }

    <!-- Tags : boucle @for avec track obligatoire -->
    <div class="mt-3 flex flex-wrap gap-1.5">
      @for (tag of mytask().tags; track tag) {
        <span class="bg-blue-100 text-blue-700 text-xs font-medium px-2 py-0.5 rounded-full">
          {{ tag }}
        </span>
      }
          <!-- <p class="mt-2 text-xs text-slate-400">{{ tagsCount() }} tag(s)</p> -->

    </div>

  </div>


  <!-- Bouton : texte dynamique selon l'état -->
  <div class="px-3.5 pb-3.5 pt-3 flex justify-center grid-cols-2 gap-2">
    <button
      class="w-full inline-flex items-center justify-center rounded-md py-2 px-4 text-sm font-medium
             shadow-sm hover:shadow-md transition-all duration-300
             bg-slate-800 text-slate-50 hover:bg-slate-700"
      (click)="onToggleClick()">
      {{ mytask().done ? 'Rouvrir' : 'Terminer' }}
    </button>
    <a [routerLink]="['/tasks', mytask().id]" class="text-blue-600 hover:underline">
      Voir le détail
    </a>
  </div>

</div>
