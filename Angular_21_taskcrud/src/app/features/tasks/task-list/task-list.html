<div class="space-y-6">
  <div class="rounded-2xl border border-sky-100 bg-white/80 p-5 shadow-[0_12px_30px_rgba(37,99,235,0.08)] backdrop-blur-sm">
    <p class="text-xs font-bold uppercase tracking-[0.2em] text-sky-700">Progression</p>
    <p class="mt-2 text-2xl font-black text-slate-800">{{ doneCount() }} tâche(s) terminée(s)</p>
  </div>

  <div class="flex flex-wrap items-stretch justify-center gap-5 p-0 md:p-2">
    @for(task of tasks(); track task.id) {
      <app-task-card [mytask]="task" (toggle)="onToggleDone(task.id)"></app-task-card>
    }
  </div>
</div>
