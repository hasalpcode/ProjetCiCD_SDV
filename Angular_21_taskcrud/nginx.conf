server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://todo-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ce trafic est interne (nginx -> backend) et n'est pas vraiment cross-origin
        # du point de vue du navigateur : on retire Origin pour ne pas déclencher
        # le filtre CORS du backend, qui n'autorise que localhost:4200.
        proxy_set_header Origin "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
