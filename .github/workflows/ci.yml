name: CI

on:
  push:
    branches:
      - main
      - dev-front
  pull_request:
    branches:
      - main
      - dev-front

jobs:
  frontend:
    name: Frontend Angular build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Angular_21_taskcrud

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Angular_21_taskcrud/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

