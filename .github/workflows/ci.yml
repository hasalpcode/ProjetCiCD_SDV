name: Front CI/CD

on:
  push:
    branches:
      - main
      - dev-front
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - dev-front
  workflow_dispatch:

jobs:
  compile-frontend:
    name: Compile Angular front
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'ci: deploy todo-front image')
    defaults:
      run:
        working-directory: Angular_21_taskcrud
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Angular_21_taskcrud/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

  sonar:
    name: SonarCloud analysis
    needs: compile-frontend
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'ci: deploy todo-front image')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  build-scan-push:
    name: Build, scan (Trivy) and push to Docker Hub
    needs: sonar
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'ci: deploy todo-front image')
    permissions:
      contents: write
    env:
      IMAGE: hasalpcode/projet_ci_cd_sdv-front
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t ${{ env.IMAGE }}:${{ github.sha }} ./Angular_21_taskcrud

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan image with Trivy
        run: trivy image --severity HIGH,CRITICAL --exit-code 0 ${{ env.IMAGE }}:${{ github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push
        run: |
          docker tag ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Update GitOps manifests (dev + prod)
        if: github.ref == 'refs/heads/main'
        run: |
          sed -i "s|image: ${{ env.IMAGE }}:.*|image: ${{ env.IMAGE }}:${{ github.sha }}|" cd_front/todo-front.yaml
          sed -i "s|image: ${{ env.IMAGE }}:.*|image: ${{ env.IMAGE }}:${{ github.sha }}|" cd_front_prod/todo-front.yaml

          git config user.email "github-actions-ci@local"
          git config user.name "github-actions-ci"

          git add cd_front/todo-front.yaml cd_front_prod/todo-front.yaml
          git commit -m "ci: deploy todo-front image ${{ github.sha }}" || echo "no changes to commit"
          git push
