name: CI

on:
  push:
    branches:
      - main
      - dev-front
  pull_request:
    branches:
      - main
      - dev-front

jobs:
  frontend:
    name: Frontend Angular build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Angular_21_taskcrud

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Angular_21_taskcrud/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

  backend:
    name: Backend Maven build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SpringBoot_Api_withBD_docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile backend with Maven
        run: ./mvnw -q -DskipTests package
