apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-front
  template:
    metadata:
      labels:
        app: todo-front
    spec:
      containers:
        - name: todo-front
          image: hasalpcode/projet_ci_cd_sdv-front:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "96Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: todo-front
spec:
  type: NodePort
  selector:
    app: todo-front
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
