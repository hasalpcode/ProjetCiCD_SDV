spring.application.name=Todo-api

spring.datasource.url=jdbc:mysql://localhost:8889/todoapp?serverTimezone=UTC&useSSL=false
# ici on le lance avec le container mysql-db pas localhost
# spring.datasource.url=jdbc:mysql://mysql-db:8889/todo_db?serverTimezone=UTC&useSSL=false 

spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect


spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true



spring.jpa.show-sql=true